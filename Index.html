<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Montserrat:wght@300;400&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #F8F9FA;
            font-family: 'Montserrat', sans-serif;
            color: #212529;
        }

        .container {
            text-align: center;
            background: #FFFFFF;
            padding: 80px 60px;
            border-radius: 4px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.5rem;
            margin-bottom: 20px;
            color: #1A1A1A;
            font-weight: 600;
            font-style: italic;
            letter-spacing: 1px;
        }

        p {
            font-size: 1rem;
            color: #6C757D;
            margin-bottom: 35px;
            font-weight: 300;
            line-height: 1.6;
            letter-spacing: 0.5px;
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            background-color: #1A1A1A;
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 2px;
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 2px;
            transition: all 0.4s ease;
            text-transform: uppercase;
        }

        .btn:hover {
            background-color: #495057;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Thank You, Pari.</h1>
        <p>Your message has been received with gratitude. We truly appreciate you taking the time to reach out.</p>
        <a href="index.html" class="btn">Return Home</a>
    </div>

</body>
</html>
